<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RotaLeve — Rota econômica</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f1720" />
  <meta name="description" content="GPS que escolhe a rota mais econômica de combustível, considerando as ladeiras da cidade." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="RotaLeve" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/favicon-64.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css" />
  <style>
    :root {
      --bg: #0f1720;
      --panel: #17212b;
      --panel-2: #1d2b38;
      --line: #2b3b4a;
      --text: #e7eef5;
      --muted: #8ea0b0;
      --accent: #34d399;
      --accent-2: #38bdf8;
      --warn: #fbbf24;
      --bad: #f87171;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 14px 18px;
      padding-top: calc(14px + env(safe-area-inset-top));
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }
    header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
    header h1 span { color: var(--accent); }
    header .tag { font-size: 12px; color: var(--muted); }
    .install-btn {
      margin-left: auto; padding: 8px 14px; border: none; border-radius: 999px;
      background: var(--accent); color: #052e22; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .install-btn:hover { filter: brightness(1.05); }
    .lock {
      position: fixed; inset: 0; z-index: 9999; background: var(--bg);
      display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    /* garante que esconder (hidden) vença o display:flex acima */
    .lock[hidden] { display: none !important; }
    .lock-card {
      max-width: 340px; width: 100%; background: var(--panel);
      border: 1px solid var(--line); border-radius: 16px; padding: 28px 22px; text-align: center;
    }
    .lock-icon { font-size: 40px; }
    .lock-card h2 { margin: 8px 0 6px; font-size: 20px; }
    .lock-card p { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 16px; }
    .lock-card input { text-align: center; letter-spacing: 1px; margin-bottom: 12px; text-transform: uppercase; }
    .lock-status { font-size: 13px; margin-top: 12px; min-height: 18px; }
    .lock-status.err { color: var(--bad); }
    .lock-status.ok { color: var(--accent); }
    .layout { flex: 1; display: flex; min-height: 0; }
    .sidebar {
      width: 380px;
      max-width: 42vw;
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #map { flex: 1; min-width: 0; background: #0b1218; }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    input[type=text], select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      font-size: 14px;
    }
    input[type=text]:focus, select:focus { outline: none; border-color: var(--accent-2); }
    .field { margin-bottom: 10px; }
    .car { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .car .field { margin-bottom: 4px; }
    button.go {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #10b981);
      color: #052e22;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    button.go:disabled { opacity: .55; cursor: default; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.4; }
    .linkbtn {
      background: none; border: none; color: var(--accent-2);
      font-size: 12px; cursor: pointer; padding: 4px 0 0; text-align: left;
    }
    .linkbtn:hover { text-decoration: underline; }
    .examples { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 4px; }
    .ex-label { font-size: 11px; color: var(--muted); width: 100%; }
    .chip {
      font-size: 12px; padding: 6px 10px; border-radius: 999px;
      border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
      cursor: pointer;
    }
    .chip:hover { border-color: var(--accent-2); }
    .realtraffic {
      font-size: 13px; color: var(--accent); background: var(--panel-2);
      border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; line-height: 1.4;
    }
    /* ---- Visual de aplicativo ---- */
    .panel { display: flex; flex-direction: column; gap: 12px; }
    .searchcard {
      display: flex; align-items: stretch; gap: 6px;
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 16px; padding: 6px 8px 6px 10px; box-shadow: 0 2px 10px rgba(0,0,0,.25);
    }
    .dots { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 4px; }
    .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
    .dot-o { background: var(--accent); }
    .dot-d { background: var(--bad); }
    .dot-line { width: 2px; flex: 1; min-height: 14px; background: var(--line); margin: 3px 0; }
    .sc-fields { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .acwrap { position: relative; }
    .searchcard input {
      width: 100%; border: none; background: none; color: var(--text);
      font-size: 15px; padding: 11px 6px;
    }
    .searchcard input:focus { outline: none; }
    .sc-divider { height: 1px; background: var(--line); margin: 0 6px; }
    .swap {
      align-self: center; background: var(--panel); border: 1px solid var(--line); color: var(--text);
      width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 15px; flex: none;
    }
    .swap:hover { border-color: var(--accent-2); color: var(--accent-2); }
    .ac {
      position: absolute; left: 0; right: 0; top: 100%; z-index: 60;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-top: 6px;
      max-height: 240px; overflow-y: auto; box-shadow: 0 12px 34px rgba(0,0,0,.55);
    }
    .ac[hidden] { display: none !important; }
    .ac-item { padding: 10px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--line); }
    .ac-item:last-child { border-bottom: none; }
    .ac-item:hover, .ac-item.active { background: var(--panel-2); }
    .ac-item .ac-main { color: var(--text); }
    .ac-item .ac-sub { color: var(--muted); font-size: 11px; margin-top: 1px; }
    .settings { border: 1px solid var(--line); border-radius: 14px; background: var(--panel-2); overflow: hidden; }
    .settings > summary {
      padding: 12px 14px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text);
      list-style: none; display: flex; justify-content: space-between; align-items: center;
    }
    .settings > summary::-webkit-details-marker { display: none; }
    .settings > summary::after { content: "▾"; color: var(--muted); }
    .settings[open] > summary::after { content: "▴"; }
    .settings-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 10px; }
    .settings-body .field { margin-bottom: 0; }
    .status { font-size: 13px; color: var(--accent-2); min-height: 18px; }
    .status.err { color: var(--bad); }
    .routes { display: flex; flex-direction: column; gap: 10px; }
    .route-card {
      border: 1px solid var(--line);
      background: var(--panel-2);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .route-card:hover { border-color: var(--accent-2); }
    .route-card.best { border-color: var(--accent); background: #14332a; }
    .route-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .route-name { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    .badge {
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
      background: var(--accent); color: #052e22;
    }
    .metrics { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
    .metric .v { font-size: 18px; font-weight: 700; }
    .metric .v small { font-size: 12px; font-weight: 600; color: var(--muted); }
    .metric .k { font-size: 11px; color: var(--muted); }
    .metric.climb .v { color: var(--warn); }
    .metric.fuel .v { color: var(--accent); }
    .metric.co2 .v { color: #9ca3af; }
    .tag-fast {
      font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px;
      background: var(--accent-2); color: #04222e; margin-left: 6px;
    }
    .summary {
      border: 1px solid var(--accent);
      background: linear-gradient(135deg, #103a2c, #0f2c33);
      border-radius: 12px;
      padding: 14px;
    }
    .summary h3 { margin: 0 0 4px; font-size: 13px; color: var(--accent); }
    .summary .lead { font-size: 13px; line-height: 1.5; }
    .summary .big { font-size: 26px; font-weight: 800; color: var(--accent); margin: 8px 0 2px; }
    .summary .sub { font-size: 12px; color: var(--muted); }
    .summary .perTrip { font-size: 12px; color: var(--muted); margin-top: 6px; }
    .profile { margin-top: 10px; }
    .profile svg { width: 100%; height: 60px; display: block; }
    footer { font-size: 11px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 10px; }
    .leaflet-container { background: #0b1218; }
    /* ---- Navegação ---- */
    .nav-btn {
      width: 100%; margin-top: 10px; padding: 11px; border: none; border-radius: 10px;
      background: var(--accent-2); color: #04222e; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .route-card.best .nav-btn { background: var(--accent); }
    .nav-btn:hover { filter: brightness(1.05); }
    .nav { position: fixed; inset: 0; z-index: 8000; pointer-events: none; }
    .nav[hidden] { display: none !important; }
    .nav-top {
      position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; pointer-events: auto;
      background: var(--accent); color: #04241b; border-radius: 16px; padding: 14px 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,.4);
    }
    .nav-dist { font-size: 24px; font-weight: 800; line-height: 1.1; }
    .nav-instr { font-size: 16px; font-weight: 600; margin-top: 2px; }
    .nav-round {
      position: absolute; bottom: calc(22px + env(safe-area-inset-bottom)); pointer-events: auto; border: none; cursor: pointer;
      background: var(--panel); color: var(--text); border: 1px solid var(--line);
      border-radius: 999px; padding: 12px 16px; font-size: 15px; font-weight: 700;
      box-shadow: 0 6px 20px rgba(0,0,0,.4);
    }
    .nav-round[title] { left: 16px; }
    .nav-exit { right: 16px; left: auto; background: var(--bad); color: #2a0a0a; border-color: transparent; }
    body.navigating .sidebar { display: none; }
    body.navigating header { display: none; }
    .nav-cursor { background: none; border: none; }
    .nav-rot { width: 36px; height: 36px; transition: transform .3s ease-out; transform-origin: 50% 50%; }
    .nav-rot svg { display: block; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
    #navMap { position: fixed; inset: 0; z-index: 7000; background: #0b1218; }
    #navMap[hidden] { display: none !important; }
    .gl-cursor svg { display: block; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); }
    .nav-cam {
      position: absolute; top: calc(96px + env(safe-area-inset-top)); left: 12px; right: 12px; pointer-events: none;
      background: var(--bad); color: #2a0a0a; font-weight: 800; font-size: 15px;
      border-radius: 12px; padding: 10px 14px; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.45);
    }
    .nav-cam[hidden] { display: none !important; }
    .ios-hint {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 10000; background: var(--panel); border: 1px solid var(--accent-2); color: var(--text);
      border-radius: 12px; padding: 12px 14px; font-size: 13px; line-height: 1.45;
      display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.5);
    }
    .ios-hint[hidden] { display: none !important; }
    .ios-hint b { color: var(--accent-2); }
    .ios-hint-x { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; margin-left: auto; padding: 0 4px; }
    .maplibregl-ctrl-attrib { font-size: 10px; }
    .legend {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
      font-size: 11px; color: var(--muted);
      background: var(--panel-2); border: 1px solid var(--line);
      border-radius: 10px; padding: 8px 10px; margin-bottom: 4px;
    }
    .legend-title { width: 100%; margin-bottom: 2px; }
    .legend .dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-left: 4px; }

    /* ---- Layout de celular ---- */
    @media (max-width: 600px) {
      header { padding: 12px 14px; }
      header .tag { display: none; }
      .layout { flex-direction: column; }
      #map { order: -1; height: 42vh; min-height: 220px; flex: none; }
      .sidebar {
        width: 100%; max-width: none; flex: 1 1 auto; min-height: 0;
        border-right: none; border-top: 1px solid var(--line);
        border-radius: 16px 16px 0 0; margin-top: -16px; z-index: 500; position: relative;
      }
      .car { grid-template-columns: 1fr 1fr; }
      input[type=text] { font-size: 16px; } /* evita zoom automático no iOS */
      .go, .chip, .linkbtn { min-height: 40px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Rota<span>Leve</span></h1>
    <button id="install" class="install-btn" hidden>📲 Instalar</button>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="panel">
        <div class="searchcard">
          <div class="dots"><span class="dot dot-o"></span><span class="dot-line"></span><span class="dot dot-d"></span></div>
          <div class="sc-fields">
            <div class="acwrap">
              <input type="text" id="orig" placeholder="Origem" autocomplete="off" />
              <div class="ac" id="acOrig" hidden></div>
            </div>
            <div class="sc-divider"></div>
            <div class="acwrap">
              <input type="text" id="dest" placeholder="Para onde?" autocomplete="off" />
              <div class="ac" id="acDest" hidden></div>
            </div>
          </div>
          <button type="button" id="swap" class="swap" title="Inverter" aria-label="Inverter origem e destino">⇅</button>
        </div>
        <button type="button" id="geo" class="linkbtn">📍 Usar minha localização</button>

        <div class="examples">
          <span class="ex-label">Exemplos:</span>
          <button type="button" class="chip" data-o="Sé, São Paulo" data-d="Gonzaga, Santos, SP">SP → Santos</button>
          <button type="button" class="chip" data-o="Praça Sete, Belo Horizonte" data-d="Centro, Nova Lima, MG">BH → Nova Lima</button>
          <button type="button" class="chip" data-o="Centro, Petrópolis, RJ" data-d="Centro, Rio de Janeiro, RJ">Petrópolis → Rio</button>
        </div>

        <details class="settings">
          <summary>⚙️ Meu carro e trânsito</summary>
          <div class="settings-body">
            <div class="car">
              <div class="field">
                <label for="kmL">Consumo (km/l)</label>
                <input type="text" id="kmL" value="12" inputmode="decimal" />
              </div>
              <div class="field">
                <label for="price">Preço (R$/l)</label>
                <input type="text" id="price" value="6.00" inputmode="decimal" />
              </div>
            </div>
            <div class="field">
              <label for="trips">Viagens por semana</label>
              <input type="text" id="trips" value="10" inputmode="numeric" />
            </div>
            <div class="field" id="trafficField">
              <label for="traffic">Trânsito</label>
              <select id="traffic">
                <option value="0">Livre (madrugada / fim de semana)</option>
                <option value="1" selected>Normal</option>
                <option value="2">Hora do rush (pico)</option>
              </select>
            </div>
          </div>
        </details>

        <button class="go" id="go">Comparar rotas</button>
      </div>
      <div class="status" id="status"></div>
      <div id="summary"></div>
      <div id="legend"></div>
      <div class="routes" id="routes"></div>
      <footer>
        <span id="credits">Dados: OpenStreetMap · OSRM · Open-Meteo.</span>
      </footer>
    </aside>
    <div id="map"></div>
  </div>

  <div id="iosHint" class="ios-hint" hidden>
    <span>📲 Para instalar no iPhone: toque em <b>Compartilhar</b> e depois em <b>"Adicionar à Tela de Início"</b>.</span>
    <button id="iosHintClose" class="ios-hint-x" aria-label="Fechar">✕</button>
  </div>

  <div id="navMap" hidden></div>

  <div id="nav" class="nav" hidden>
    <div class="nav-top">
      <div class="nav-dist" id="navDist">—</div>
      <div class="nav-instr" id="navInstr">Iniciando navegação…</div>
    </div>
    <div id="navCam" class="nav-cam" hidden></div>
    <button id="navMute" class="nav-round" title="Voz">🔊</button>
    <button id="navExit" class="nav-round nav-exit">✕ Sair</button>
  </div>

  <div id="lock" class="lock" hidden>
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h2>Acesso ao RotaLeve</h2>
      <p id="lockMsg">Digite sua chave de acesso para ativar este aparelho.</p>
      <input type="text" id="lockKey" placeholder="Ex: TESTE-1234" autocomplete="off" />
      <button id="lockBtn" class="go">Ativar aparelho</button>
      <div id="lockStatus" class="lock-status"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
  <script>
  (function () {
    const COLORS = ["#34d399", "#38bdf8", "#f472b6", "#fbbf24"];
    // Mapbox: trânsito real. Com token preenchido, usa Mapbox (trânsito ao vivo);
    // vazio = usa OSRM grátis + trânsito simulado (o app funciona nos dois casos).
    // O token NÃO fica aqui (código público). É buscado no servidor após ativar a chave.
    const MAPBOX = { token: "" };
    const map = L.map("map", { zoomControl: true }).setView([-15.78, -47.93], 5);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap"
    }).addTo(map);

    const $ = (id) => document.getElementById(id);
    const statusEl = $("status");
    const routesEl = $("routes");
    let drawnLayers = [];
    let markers = [];
    let fixedOrigin = null; // usado quando a origem vem da localização do GPS
    let pickedOrigin = null, pickedDest = null; // coordenadas escolhidas no autocompletar

    function setStatus(msg, isErr) {
      statusEl.textContent = msg || "";
      statusEl.className = "status" + (isErr ? " err" : "");
    }

    async function geocode(q) {
      const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(q);
      const r = await fetch(url, { headers: { "Accept": "application/json" } });
      const data = await r.json();
      if (!data.length) throw new Error('Não encontrei o endereço: "' + q + '"');
      return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon), name: data[0].display_name };
    }

    async function reverseGeocode(lat, lon) {
      try {
        const url = "https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lon;
        const r = await fetch(url, { headers: { "Accept": "application/json" } });
        const d = await r.json();
        return d.display_name || null;
      } catch (e) { return null; }
    }

    function useMyLocation() {
      if (!navigator.geolocation) { setStatus("Seu navegador não suporta localização.", true); return; }
      setStatus("Obtendo sua localização…");
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        fixedOrigin = { lat, lon, name: "Minha localização" }; pickedOrigin = null;
        $("orig").value = "📍 Minha localização";
        const addr = await reverseGeocode(lat, lon);
        if (addr) $("orig").value = addr;
        setStatus("✅ Localização definida — agora informe o destino.");
      }, () => {
        setStatus("Não consegui acessar sua localização (permissão negada?).", true);
      }, { enableHighAccuracy: true, timeout: 10000 });
    }

    async function getRoutes(a, b) {
      const coords = a.lon + "," + a.lat + ";" + b.lon + "," + b.lat;

      // Se ainda não temos o token do Mapbox (mas o app está licenciado), tenta buscá-lo agora.
      if (!MAPBOX.token && LICENSE.enabled && LICENSE.endpoint) {
        try { await loadMapboxToken(); } catch (e) {}
      }

      // Com token do Mapbox: rotas com TRÂNSITO REAL (perfil driving-traffic).
      if (MAPBOX.token) {
        const url = "https://api.mapbox.com/directions/v5/mapbox/driving-traffic/" + coords +
          "?alternatives=true&geometries=geojson&overview=full&steps=true&language=pt&access_token=" +
          encodeURIComponent(MAPBOX.token);
        const r = await fetch(url);
        const data = await r.json();
        if (!data.routes || !data.routes.length)
          throw new Error((data && data.message) || "Não consegui calcular rotas (Mapbox).");
        return data.routes; // mesmo formato: { geometry.coordinates, distance, duration }
      }

      // Sem token: OSRM grátis (sem trânsito real; usamos a simulação).
      const url = "https://router.project-osrm.org/route/v1/driving/" + coords +
        "?alternatives=true&overview=full&geometries=geojson&steps=true";
      const r = await fetch(url);
      const data = await r.json();
      if (data.code !== "Ok" || !data.routes || !data.routes.length)
        throw new Error("Não consegui calcular rotas entre esses pontos.");
      return data.routes;
    }

    // sample up to `max` evenly spaced points from a [lon,lat] array
    function sample(coordsLonLat, max) {
      const n = coordsLonLat.length;
      if (n <= max) return coordsLonLat.slice();
      const out = [];
      for (let i = 0; i < max; i++) {
        out.push(coordsLonLat[Math.round(i * (n - 1) / (max - 1))]);
      }
      return out;
    }

    async function getElevations(pts) {
      const lats = pts.map(p => p[1].toFixed(5)).join(",");
      const lons = pts.map(p => p[0].toFixed(5)).join(",");
      const url = "https://api.open-meteo.com/v1/elevation?latitude=" + lats + "&longitude=" + lons;
      const r = await fetch(url);
      const data = await r.json();
      if (!data.elevation) throw new Error("Falha ao obter altitudes.");
      return data.elevation;
    }

    function climbFrom(elevs) {
      let gain = 0;
      for (let i = 1; i < elevs.length; i++) {
        const d = elevs[i] - elevs[i - 1];
        if (d > 0) gain += d;
      }
      return gain;
    }

    // Estimativa de combustível:
    //  - parte plana: distância ÷ consumo do carro
    //  - parte de subida: energia p/ erguer o carro (massa·g·altura) convertida em litros
    const MASS = 1400;          // kg (carro médio)
    const G = 9.81;             // gravidade
    const USEFUL_J_PER_L = 8.5e6; // energia útil por litro de gasolina (após perdas do motor)
    const CO2_PER_L = 2.31;       // kg de CO2 por litro de gasolina queimado
    const WEEKS_PER_MONTH = 4.33;
    function tripsPerWeek() {
      return Math.max(0, parseFloat(($("trips").value || "").replace(",", ".")) || 0);
    }
    function trafficLevel() {
      return parseInt($("traffic").value, 10) || 0; // 0 livre, 1 normal, 2 pico
    }
    // quão "urbana" é a rota (0 = rodovia rápida, 1 = trânsito de cidade),
    // deduzida da velocidade média que o roteador estimou
    function urbanFactor(route) {
      const avgKmh = (route.distance / 1000) / (route.duration / 3600);
      return Math.min(1, Math.max(0, (80 - avgKmh) / 60));
    }
    function carParams() {
      const kmL = Math.max(1, parseFloat(($("kmL").value || "").replace(",", ".")) || 12);
      const price = Math.max(0, parseFloat(($("price").value || "").replace(",", ".")) || 0);
      return { kmL, price };
    }

    function fmtKm(m) { return (m / 1000).toFixed(1); }
    function fmtMin(s) { return Math.round(s / 60); }

    function profileSvg(elevs, color) {
      const w = 320, h = 60, pad = 4;
      const min = Math.min(...elevs), max = Math.max(...elevs);
      const range = Math.max(1, max - min);
      const pts = elevs.map((e, i) => {
        const x = pad + i * (w - 2 * pad) / (elevs.length - 1);
        const y = h - pad - (e - min) / range * (h - 2 * pad);
        return x.toFixed(1) + "," + y.toFixed(1);
      }).join(" ");
      const area = "M" + pad + "," + (h - pad) + " L" + pts.replace(/ /g, " L") + " L" + (w - pad) + "," + (h - pad) + " Z";
      return '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
        '<path d="' + area + '" fill="' + color + '22" />' +
        '<polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="2" />' +
        '</svg>';
    }

    function clearMap() {
      drawnLayers.forEach(l => map.removeLayer(l));
      markers.forEach(m => map.removeLayer(m));
      if (slopeGroup) { map.removeLayer(slopeGroup); slopeGroup = null; }
      drawnLayers = []; markers = [];
    }

    let routeData = [];
    let lastA = null, lastB = null;
    let slopeGroup = null; // camada colorida por inclinação da rota selecionada

    // distância horizontal em metros entre dois pontos [lon,lat]
    function hdist(a, b) {
      const R = 6371000, toR = Math.PI / 180;
      const dLat = (b[1] - a[1]) * toR, dLon = (a[0] - b[0]) * toR;
      const lat1 = a[1] * toR, lat2 = b[1] * toR;
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(h));
    }

    // cor de acordo com a inclinação (grade = subida ÷ distância horizontal)
    function slopeColor(grade) {
      if (grade > 0.08) return "#dc2626";   // íngreme
      if (grade > 0.04) return "#f97316";   // forte
      if (grade > 0.015) return "#fbbf24";  // leve
      if (grade < -0.015) return "#34d399"; // descida
      return "#60a5fa";                     // plano
    }

    function buildSlopeLayer(rd) {
      const g = L.layerGroup();
      const pts = rd.pts, el = rd.elevs;
      for (let i = 1; i < pts.length; i++) {
        const d = hdist(pts[i - 1], pts[i]);
        const grade = d > 3 ? (el[i] - el[i - 1]) / d : 0;
        L.polyline(
          [[pts[i - 1][1], pts[i - 1][0]], [pts[i][1], pts[i][0]]],
          { color: slopeColor(grade), weight: 8, opacity: 0.95, lineCap: "round" }
        ).addTo(g);
      }
      return g;
    }

    function highlight(idx) {
      drawnLayers.forEach((l, i) => {
        // rota selecionada fica bem apagada (o destaque colorido entra por cima);
        // as outras ficam visíveis na sua cor para mostrar que há alternativas
        l.setStyle({ weight: i === idx ? 3 : 4, opacity: i === idx ? 0.15 : 0.55 });
      });
      if (slopeGroup) { map.removeLayer(slopeGroup); slopeGroup = null; }
      const rd = routeData[idx];
      if (rd && rd.pts) { slopeGroup = buildSlopeLayer(rd); slopeGroup.addTo(map); }
      document.querySelectorAll(".route-card").forEach((c, i) => {
        c.style.outline = i === idx ? "2px solid #38bdf8" : "none";
      });
    }

    function render(a, b, fit) {
      lastA = a; lastB = b;
      routesEl.innerHTML = "";
      clearMap();

      markers.push(L.marker([a.lat, a.lon]).addTo(map).bindPopup("Origem"));
      markers.push(L.marker([b.lat, b.lon]).addTo(map).bindPopup("Destino"));

      // Com Mapbox, a duração já inclui o trânsito real → não aplica a simulação (level 0).
      const level = MAPBOX.token ? 0 : trafficLevel();
      const { kmL, price } = carParams();
      routeData.forEach(rd => {
        const urban = urbanFactor(rd.route);
        const timeMult = 1 + level * 0.35 * urban; // trânsito atrasa mais as rotas urbanas
        const fuelMult = 1 + level * 0.20 * urban; // parar-e-andar gasta mais combustível
        const distKm = rd.route.distance / 1000;
        const flat = (distKm / kmL) * fuelMult;
        const extra = (MASS * G * rd.climb) / USEFUL_J_PER_L; // energia das subidas
        rd.urban = urban;
        rd.duration = rd.route.duration * timeMult;
        rd.liters = flat + extra;
        rd.cost = rd.liters * price;
        rd.co2 = rd.liters * CO2_PER_L;
      });
      const bestIdx = routeData.reduce((best, r, i) =>
        r.liters < routeData[best].liters ? i : best, 0);
      const fastIdx = routeData.reduce((f, r, i) =>
        r.duration < routeData[f].duration ? i : f, 0);
      const timeLabel = MAPBOX.token ? "tempo c/ trânsito real"
        : (level > 0 ? "tempo c/ trânsito" : "tempo est.");

      const allLatLngs = [];
      routeData.forEach((rd, i) => {
        const color = COLORS[i % COLORS.length];
        const latlngs = rd.route.geometry.coordinates.map(c => [c[1], c[0]]);
        allLatLngs.push(...latlngs);
        const line = L.polyline(latlngs, { color, weight: 4, opacity: 0.7 }).addTo(map);
        line.bindTooltip((i === 0 ? "Rota principal" : "Alternativa " + i) +
          " · R$ " + rd.cost.toFixed(2), { sticky: true });
        line.on("click", () => highlight(i));
        drawnLayers.push(line);

        const card = document.createElement("div");
        card.className = "route-card" + (i === bestIdx ? " best" : "");
        card.innerHTML =
          '<div class="route-head">' +
            '<div class="route-name"><span class="swatch" style="background:' + color + '"></span>' +
              (i === 0 ? "Rota principal" : "Alternativa " + i) +
              (i === fastIdx ? '<span class="tag-fast">MAIS RÁPIDA</span>' : '') + '</div>' +
            (i === bestIdx ? '<span class="badge">MAIS ECONÔMICA ⛽</span>' : '') +
          '</div>' +
          '<div class="metrics">' +
            '<div class="metric fuel"><div class="v">R$ ' + rd.cost.toFixed(2) + '</div><div class="k">custo estimado</div></div>' +
            '<div class="metric"><div class="v">' + rd.liters.toFixed(2) + '<small> L</small></div><div class="k">combustível</div></div>' +
            '<div class="metric co2"><div class="v">' + rd.co2.toFixed(1) + '<small> kg</small></div><div class="k">CO₂</div></div>' +
          '</div>' +
          '<div class="metrics">' +
            '<div class="metric climb"><div class="v">' + Math.round(rd.climb) + '<small> m</small></div><div class="k">subida total</div></div>' +
            '<div class="metric"><div class="v">' + fmtKm(rd.route.distance) + '<small> km</small></div><div class="k">distância</div></div>' +
            '<div class="metric"><div class="v">' + fmtMin(rd.duration) + '<small> min</small></div><div class="k">' + timeLabel + '</div></div>' +
          '</div>' +
          '<div class="profile">' + profileSvg(rd.elevs, color) + '</div>' +
          '<button class="nav-btn" data-idx="' + i + '">🧭 Navegar por esta rota</button>';
        card.addEventListener("click", () => highlight(i));
        const nb = card.querySelector(".nav-btn");
        if (nb) nb.addEventListener("click", (e) => { e.stopPropagation(); startNav(i); });
        routesEl.appendChild(card);
      });

      if (fit !== false) map.fitBounds(L.latLngBounds(allLatLngs), { padding: [40, 40] });
      highlight(bestIdx);

      document.getElementById("legend").innerHTML =
        '<div class="legend"><span class="legend-title">No mapa, a rota selecionada mostra as ladeiras:</span>' +
        '<span class="dot" style="background:#34d399"></span>descida' +
        '<span class="dot" style="background:#60a5fa"></span>plano' +
        '<span class="dot" style="background:#fbbf24"></span>leve' +
        '<span class="dot" style="background:#f97316"></span>forte' +
        '<span class="dot" style="background:#dc2626"></span>íngreme</div>';

      const summaryEl = document.getElementById("summary");
      const best = routeData[bestIdx];
      const fast = routeData[fastIdx];
      const trips = tripsPerWeek();
      const monthlyTrips = trips * WEEKS_PER_MONTH;

      if (routeData.length > 1 && bestIdx !== fastIdx) {
        const dR = fast.cost - best.cost;
        const dL = fast.liters - best.liters;
        const dCo2 = fast.co2 - best.co2;
        const extraMin = Math.round((best.duration - fast.duration) / 60);
        summaryEl.innerHTML =
          '<div class="summary">' +
            '<h3>💡 Vale trocar de rota</h3>' +
            '<div class="lead">Trocando a rota mais rápida pela mais econômica, cada viagem economiza ' +
              '<b>R$ ' + dR.toFixed(2) + '</b>, <b>' + dL.toFixed(2) + ' L</b> e <b>' + dCo2.toFixed(1) + ' kg</b> de CO₂' +
              (extraMin > 0 ? ', custando só ' + extraMin + ' min a mais' : '') + '.</div>' +
            (monthlyTrips > 0 ?
              '<div class="big">R$ ' + (dR * monthlyTrips).toFixed(2) + '<span class="sub"> / mês</span></div>' +
              '<div class="sub">e ' + (dCo2 * monthlyTrips).toFixed(0) + ' kg de CO₂ a menos por mês · ' +
                trips + ' viagens/semana</div>' : '') +
          '</div>';
        setStatus("");
      } else if (routeData.length > 1) {
        summaryEl.innerHTML = '<div class="summary"><h3>👍 Boa notícia</h3>' +
          '<div class="lead">Neste trajeto, a rota mais rápida já é também a mais econômica.</div></div>';
        setStatus("");
      } else {
        summaryEl.innerHTML = "";
        setStatus("✅ Pronto — 1 rota analisada (não havia caminho alternativo aqui).");
      }
    }

    // recalcula os custos ao vivo quando você muda o carro (sem refazer a busca)
    function recompute() {
      if (routeData.length && lastA && lastB) render(lastA, lastB, false);
    }

    // ---- Navegação por voz seguindo a rota ----
    let navWatch = null, navMarker = null, navSteps = [], navIndex = 0, navAnnounced = {};
    let navMuted = false, wakeLock = null, navLastPt = null, navZoomSet = false;
    let navDest = null, navRouteCoords = [], offCount = 0, rerouting = false;
    let navCameras = [], camAlerted = {}, glPendingCameras = false;

    // direção (0-360) entre dois pontos [lon,lat]
    function bearing(a, b) {
      const toR = Math.PI / 180, toD = 180 / Math.PI;
      const y = Math.sin((b[0] - a[0]) * toR) * Math.cos(b[1] * toR);
      const x = Math.cos(a[1] * toR) * Math.sin(b[1] * toR) -
        Math.sin(a[1] * toR) * Math.cos(b[1] * toR) * Math.cos((b[0] - a[0]) * toR);
      return (Math.atan2(y, x) * toD + 360) % 360;
    }
    // ponto a `dist` metros à frente, na direção `brng` (para o carro ficar mais embaixo na tela)
    function destPoint(lat, lon, brng, dist) {
      const R = 6371000, br = brng * Math.PI / 180;
      const lat1 = lat * Math.PI / 180, lon1 = lon * Math.PI / 180, dr = dist / R;
      const lat2 = Math.asin(Math.sin(lat1) * Math.cos(dr) + Math.cos(lat1) * Math.sin(dr) * Math.cos(br));
      const lon2 = lon1 + Math.atan2(Math.sin(br) * Math.sin(dr) * Math.cos(lat1),
        Math.cos(dr) - Math.sin(lat1) * Math.sin(lat2));
      return [lat2 * 180 / Math.PI, lon2 * 180 / Math.PI];
    }

    // ---- Mapa imersivo (MapLibre): gira junto com o trajeto (heading-up) + 3D ----
    let glMap = null, glMarker = null, glReady = false, glPendingRoute = null;
    function glAvailable() { return typeof maplibregl !== "undefined"; }
    const OSM_STYLE = {
      version: 8,
      sources: {
        osm: {
          type: "raster", tileSize: 256,
          tiles: [
            "https://a.tile.openstreetmap.org/{z}/{x}/{y}.png",
            "https://b.tile.openstreetmap.org/{z}/{x}/{y}.png",
            "https://c.tile.openstreetmap.org/{z}/{x}/{y}.png"
          ],
          attribution: "© OpenStreetMap"
        }
      },
      layers: [{ id: "osm", type: "raster", source: "osm" }]
    };
    function initGLNav() {
      if (glMap || !glAvailable()) return;
      try {
        glMap = new maplibregl.Map({
          container: "navMap", style: OSM_STYLE,
          center: [-46.63, -23.55], zoom: 16, pitch: 55, bearing: 0,
          attributionControl: { compact: true }, interactive: false
        });
        const elm = document.createElement("div");
        elm.className = "gl-cursor";
        elm.innerHTML = '<svg width="40" height="40" viewBox="0 0 36 36">' +
          '<circle cx="18" cy="18" r="16" fill="#38bdf8" opacity="0.25"/>' +
          '<path d="M18 3 L29 31 L18 24 L7 31 Z" fill="#38bdf8" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></svg>';
        glMarker = new maplibregl.Marker({ element: elm });
        glMap.on("load", () => {
          glReady = true;
          if (glPendingRoute) { setGLRoute(glPendingRoute); glPendingRoute = null; }
          if (glPendingCameras) { setGLCameras(); glPendingCameras = false; }
        });
      } catch (e) { glMap = null; glMarker = null; } // sem WebGL → cai no mapa Leaflet
    }
    function setGLRoute(coords) {
      const data = { type: "Feature", geometry: { type: "LineString", coordinates: coords } };
      if (glMap.getSource("route")) { glMap.getSource("route").setData(data); return; }
      glMap.addSource("route", { type: "geojson", data: data });
      glMap.addLayer({
        id: "route", type: "line", source: "route",
        paint: { "line-color": "#34d399", "line-width": 8, "line-opacity": 0.9 },
        layout: { "line-cap": "round", "line-join": "round" }
      });
    }
    // segue o veículo: no MapLibre gira o mapa (rua sempre pra cima); senão, mapa Leaflet fixo com seta girando
    function navFollow(lat, lon, heading) {
      if (glMap) {
        glMarker.setLngLat([lon, lat]);
        glMap.easeTo({
          center: [lon, lat], zoom: 17, pitch: 55,
          bearing: (heading != null ? heading : glMap.getBearing()),
          duration: 800, offset: [0, 110]
        });
        return;
      }
      if (!navMarker._map) navMarker.addTo(map);
      navMarker.setLatLng([lat, lon]);
      if (heading != null) {
        const el = navMarker.getElement();
        if (el) { const r = el.querySelector(".nav-rot"); if (r) r.style.transform = "rotate(" + heading + "deg)"; }
      }
      const center = (heading != null) ? destPoint(lat, lon, heading, 130) : [lat, lon];
      if (!navZoomSet) { map.setView(center, 17); navZoomSet = true; }
      else { map.panTo(center, { animate: true, duration: 0.9, easeLinearity: 0.4 }); }
    }

    // vértice mais próximo da rota: distância (m) + índice (progresso ao longo da rota)
    function nearestIdx(coordsArr, lon, lat) {
      let min = Infinity, idx = 0;
      for (let i = 0; i < coordsArr.length; i++) {
        const d = hdist([lon, lat], coordsArr[i]);
        if (d < min) { min = d; idx = i; }
      }
      return { dist: min, idx: idx };
    }

    // ---- Radares (dados do OpenStreetMap via Overpass) ----
    async function fetchCameras(coords) {
      navCameras = []; camAlerted = {};
      try {
        let minLat = 90, minLon = 180, maxLat = -90, maxLon = -180;
        for (const c of coords) {
          if (c[1] < minLat) minLat = c[1]; if (c[1] > maxLat) maxLat = c[1];
          if (c[0] < minLon) minLon = c[0]; if (c[0] > maxLon) maxLon = c[0];
        }
        const p = 0.008;
        const bbox = (minLat - p) + "," + (minLon - p) + "," + (maxLat + p) + "," + (maxLon + p);
        const q = '[out:json][timeout:20];node["highway"="speed_camera"](' + bbox + ');out;';
        const servers = [
          "https://overpass-api.de/api/interpreter",
          "https://overpass.kumi.systems/api/interpreter"
        ];
        let data = null;
        for (const ep of servers) {
          try {
            const ctrl = new AbortController();
            const to = setTimeout(() => ctrl.abort(), 15000);
            const resp = await fetch(ep + "?data=" + encodeURIComponent(q), { signal: ctrl.signal });
            clearTimeout(to);
            const txt = await resp.text();
            if (txt.trim().charAt(0) === "{") { data = JSON.parse(txt); break; } // só JSON válido
          } catch (e) { /* tenta o próximo servidor */ }
        }
        if (!data) throw new Error("radares indisponíveis no momento");
        const raw = (data.elements || []).map(e => ({
          lat: e.lat, lon: e.lon, max: (e.tags && (e.tags.maxspeed || e.tags["maxspeed:forward"])) || ""
        }));
        let id = 0;
        navCameras = raw.map(cam => {
          const nr = nearestIdx(coords, cam.lon, cam.lat);
          return { id: id++, lat: cam.lat, lon: cam.lon, max: cam.max, idx: nr.idx, distR: nr.dist };
        }).filter(cam => cam.distR < 45); // só os radares que estão na nossa rota
        if (glMap && glReady) setGLCameras();
        else if (glMap) glPendingCameras = true;
      } catch (e) {}
    }
    function setGLCameras() {
      if (!glMap) return;
      const fc = { type: "FeatureCollection", features: navCameras.map(c => ({
        type: "Feature", geometry: { type: "Point", coordinates: [c.lon, c.lat] }, properties: {}
      })) };
      if (glMap.getSource("cameras")) { glMap.getSource("cameras").setData(fc); return; }
      glMap.addSource("cameras", { type: "geojson", data: fc });
      glMap.addLayer({
        id: "cameras", type: "circle", source: "cameras",
        paint: { "circle-radius": 7, "circle-color": "#f59e0b", "circle-stroke-color": "#fff", "circle-stroke-width": 2 }
      });
    }
    function checkCameras(lon, lat, curIdx) {
      for (const cam of navCameras) {
        if (camAlerted[cam.id]) continue;
        if (cam.idx < curIdx - 2) continue; // já ficou para trás
        const d = hdist([lon, lat], [cam.lon, cam.lat]);
        if (d < 320) {
          camAlerted[cam.id] = true;
          const lim = String(cam.max).replace(/[^0-9]/g, "");
          speak("Atenção, radar." + (lim ? " Limite " + lim + " por hora." : ""));
          showCam(lim, Math.round(d));
        }
      }
    }
    function showCam(limit, dist) {
      const el = $("navCam");
      el.textContent = "📷 Radar a " + dist + " m" + (limit ? " · " + limit + " km/h" : "");
      el.hidden = false;
      clearTimeout(el._t); el._t = setTimeout(() => { el.hidden = true; }, 8000);
    }

    // recalcula a rota da posição atual até o destino (quando saiu do caminho)
    async function reroute(lat, lon) {
      if (rerouting || !navDest) return;
      rerouting = true; offCount = 0;
      navSetBanner(null, "Recalculando rota…");
      speak("Recalculando rota.");
      try {
        const routes = await getRoutes({ lat: lat, lon: lon }, { lat: navDest[1], lon: navDest[0] });
        const r = routes[0];
        navSteps = ((r.legs && r.legs[0] && r.legs[0].steps) || [])
          .filter(s => s.maneuver && s.maneuver.location)
          .map(s => ({ instr: s.maneuver.instruction || "Siga em frente", loc: s.maneuver.location }));
        navIndex = 0; navAnnounced = {};
        navRouteCoords = r.geometry.coordinates;
        if (glMap && glReady) setGLRoute(navRouteCoords);
        else if (glMap) glPendingRoute = navRouteCoords;
        fetchCameras(navRouteCoords);
        speak("Rota recalculada.");
      } catch (e) {
        navSetBanner(null, "Não consegui recalcular. Siga em direção ao destino.");
      } finally {
        rerouting = false;
      }
    }

    function speak(text) {
      if (navMuted) return;
      try {
        if (!("speechSynthesis" in window)) return;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "pt-BR"; u.rate = 1;
        speechSynthesis.cancel();
        speechSynthesis.speak(u);
      } catch (e) {}
    }

    function navSetBanner(distMeters, instr) {
      $("navDist").textContent = (distMeters == null) ? "" :
        (distMeters >= 1000 ? (distMeters / 1000).toFixed(1) + " km" : Math.round(distMeters) + " m");
      $("navInstr").textContent = instr || "";
    }

    async function startNav(idx) {
      const rd = routeData[idx];
      if (!rd || !rd.steps || !rd.steps.length) {
        alert("Esta rota não tem instruções de navegação disponíveis.");
        return;
      }
      navSteps = rd.steps
        .filter(s => s.maneuver && s.maneuver.location)
        .map(s => ({ instr: s.maneuver.instruction || "Siga em frente", loc: s.maneuver.location }));
      navIndex = 0; navAnnounced = {}; navLastPt = null; navZoomSet = false;
      navRouteCoords = rd.route.geometry.coordinates;
      navDest = navRouteCoords[navRouteCoords.length - 1];
      offCount = 0; rerouting = false;
      $("navCam").hidden = true;
      fetchCameras(navRouteCoords);
      document.body.classList.add("navigating");
      $("nav").hidden = false;
      $("navMute").textContent = navMuted ? "🔇" : "🔊";
      setTimeout(() => map.invalidateSize(), 120);
      try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}

      // mapa imersivo (gira junto). Se o MapLibre não estiver disponível, usa o mapa Leaflet com seta.
      if (glAvailable()) {
        $("navMap").hidden = false;
        initGLNav();
        if (glMap) {
          setTimeout(() => { try { glMap.resize(); } catch (e) {} }, 60);
          const coords = rd.route.geometry.coordinates;
          if (glReady) setGLRoute(coords); else glPendingRoute = coords;
          if (glMarker) glMarker.setLngLat(coords[0]).addTo(glMap);
        } else {
          $("navMap").hidden = true; // WebGL indisponível → usa o mapa com seta
        }
      }

      if (!navMarker) navMarker = L.marker([0, 0], {
        icon: L.divIcon({
          className: "nav-cursor",
          html: '<div class="nav-rot"><svg width="36" height="36" viewBox="0 0 36 36">' +
            '<circle cx="18" cy="18" r="16" fill="#38bdf8" opacity="0.25"/>' +
            '<path d="M18 4 L28 30 L18 23 L8 30 Z" fill="#38bdf8" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>' +
            '</svg></div>',
          iconSize: [36, 36], iconAnchor: [18, 18]
        }),
        interactive: false, keyboard: false
      });
      if (!navigator.geolocation) { navSetBanner(null, "GPS não disponível neste aparelho."); return; }
      navSetBanner(null, "Buscando sua posição…");
      speak("Navegação iniciada. Siga pela rota.");
      navWatch = navigator.geolocation.watchPosition(onNavPos, onNavErr,
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
    }

    function onNavPos(pos) {
      const lat = pos.coords.latitude, lon = pos.coords.longitude;

      // direção: usa a do GPS; se não tiver, calcula pelo deslocamento
      let heading = (pos.coords.heading != null && !isNaN(pos.coords.heading)) ? pos.coords.heading : null;
      if (heading == null && navLastPt) {
        const moved = hdist(navLastPt, [lon, lat]);
        if (moved > 3) heading = bearing(navLastPt, [lon, lat]);
      }
      navLastPt = [lon, lat];

      navFollow(lat, lon, heading);

      if (rerouting) return; // aguardando o recálculo terminar

      // progresso na rota + saiu da rota? (fora por 3 leituras seguidas → recalcula)
      if (navRouteCoords.length) {
        const near = nearestIdx(navRouteCoords, lon, lat);
        if (near.dist > 55) { if (++offCount >= 3) { reroute(lat, lon); return; } }
        else offCount = 0;
        if (navCameras.length) checkCameras(lon, lat, near.idx);
      }

      let guard = 0;
      while (navIndex < navSteps.length && guard++ < 12) {
        const st = navSteps[navIndex];
        const d = hdist([lon, lat], st.loc);
        if (d < 35) { speak(st.instr); navIndex++; continue; }
        navSetBanner(d, st.instr);
        if (d < 250 && !navAnnounced[navIndex]) {
          speak("Em " + (Math.round(d / 10) * 10) + " metros, " + st.instr);
          navAnnounced[navIndex] = true;
        }
        break;
      }
      if (navIndex >= navSteps.length) {
        navSetBanner(null, "Você chegou ao destino. 🎉");
        speak("Você chegou ao destino.");
        stopNav();
      }
    }

    function onNavErr(err) {
      navSetBanner(null, (err && err.code === 1)
        ? "Permita o acesso à localização para navegar."
        : "Não consegui obter sua localização.");
    }

    function stopNav() {
      if (navWatch != null) { try { navigator.geolocation.clearWatch(navWatch); } catch (e) {} navWatch = null; }
      if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
      try { speechSynthesis.cancel(); } catch (e) {}
      if (navMarker && navMarker._map) map.removeLayer(navMarker);
      if (glMarker) { try { glMarker.remove(); } catch (e) {} }
      $("navMap").hidden = true;
      document.body.classList.remove("navigating");
      $("nav").hidden = true;
      setTimeout(() => map.invalidateSize(), 120);
    }

    async function run() {
      const o = $("orig").value.trim();
      const d = $("dest").value.trim();
      if (!o || !d) { setStatus("Preencha origem e destino.", true); return; }
      $("go").disabled = true;
      routesEl.innerHTML = "";
      document.getElementById("summary").innerHTML = "";
      document.getElementById("legend").innerHTML = "";
      try {
        setStatus("Procurando endereços…");
        const bothGeocode = (!fixedOrigin && !pickedOrigin) && !pickedDest;
        let a;
        if (fixedOrigin) a = fixedOrigin;
        else if (pickedOrigin) a = pickedOrigin;
        else a = await geocode(o);
        if (bothGeocode) await new Promise(r => setTimeout(r, 1100)); // respeita limite do Nominatim
        const b = pickedDest ? pickedDest : await geocode(d);

        setStatus("Calculando rotas possíveis…");
        const routes = await getRoutes(a, b);

        setStatus("Medindo as subidas de cada rota…");
        routeData = [];
        for (const route of routes) {
          const pts = sample(route.geometry.coordinates, 100);
          const elevs = await getElevations(pts);
          const steps = (route.legs && route.legs[0] && route.legs[0].steps) ? route.legs[0].steps : [];
          routeData.push({ route, elevs, pts, steps, climb: climbFrom(elevs) });
          await new Promise(r => setTimeout(r, 300));
        }
        render(a, b);
      } catch (e) {
        setStatus("⚠️ " + e.message, true);
      } finally {
        $("go").disabled = false;
      }
    }

    $("go").addEventListener("click", run);
    $("dest").addEventListener("keydown", e => { if (e.key === "Enter") run(); });
    $("navExit").addEventListener("click", () => stopNav());
    $("navMute").addEventListener("click", () => {
      navMuted = !navMuted;
      $("navMute").textContent = navMuted ? "🔇" : "🔊";
      if (navMuted) { try { speechSynthesis.cancel(); } catch (e) {} }
    });
    $("kmL").addEventListener("input", recompute);
    $("price").addEventListener("input", recompute);
    $("trips").addEventListener("input", recompute);
    $("traffic").addEventListener("change", recompute);
    $("geo").addEventListener("click", useMyLocation);
    document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
      fixedOrigin = null; pickedOrigin = null; pickedDest = null;
      $("orig").value = c.getAttribute("data-o");
      $("dest").value = c.getAttribute("data-d");
      hideAc($("acOrig")); hideAc($("acDest"));
      run();
    }));

    // ---- Autocompletar de endereços (via Mapbox) ----
    function hideAc(el) { el.hidden = true; el.innerHTML = ""; }
    function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
    async function queryAc(q, acEl, input, onPick) {
      if (!MAPBOX.token) return;
      try {
        const url = "https://api.mapbox.com/geocoding/v5/mapbox.places/" + encodeURIComponent(q) +
          ".json?access_token=" + encodeURIComponent(MAPBOX.token) + "&country=br&language=pt&limit=5&autocomplete=true";
        const data = await fetch(url).then(r => r.json());
        const feats = data.features || [];
        if (!feats.length) { hideAc(acEl); return; }
        acEl.innerHTML = "";
        feats.forEach(f => {
          const div = document.createElement("div");
          div.className = "ac-item";
          div.innerHTML = '<div class="ac-main">' + escapeHtml(f.text || f.place_name) + '</div>' +
            '<div class="ac-sub">' + escapeHtml(f.place_name) + '</div>';
          div.addEventListener("mousedown", (e) => {
            e.preventDefault();
            input.value = f.place_name;
            onPick({ lat: f.center[1], lon: f.center[0], name: f.place_name });
            hideAc(acEl);
          });
          acEl.appendChild(div);
        });
        acEl.hidden = false;
      } catch (e) { hideAc(acEl); }
    }
    function attachAutocomplete(input, acEl, onPick, onClear) {
      let t = null;
      input.addEventListener("input", () => {
        onClear();
        const q = input.value.trim();
        clearTimeout(t);
        if (q.length < 3 || !MAPBOX.token) { hideAc(acEl); return; }
        t = setTimeout(() => queryAc(q, acEl, input, onPick), 300);
      });
      input.addEventListener("blur", () => { setTimeout(() => { acEl.hidden = true; }, 150); });
      input.addEventListener("focus", () => { if (acEl.children.length) acEl.hidden = false; });
    }
    attachAutocomplete($("orig"), $("acOrig"),
      (c) => { pickedOrigin = c; fixedOrigin = null; },
      () => { pickedOrigin = null; fixedOrigin = null; });
    attachAutocomplete($("dest"), $("acDest"),
      (c) => { pickedDest = c; },
      () => { pickedDest = null; });

    // Inverter origem ↔ destino
    $("swap").addEventListener("click", () => {
      const ov = $("orig").value, dv = $("dest").value;
      $("orig").value = dv; $("dest").value = ov;
      let po = pickedOrigin;
      if (fixedOrigin) { po = fixedOrigin; fixedOrigin = null; }
      pickedOrigin = pickedDest; pickedDest = po;
      hideAc($("acOrig")); hideAc($("acDest"));
    });

    // Dica de instalação no iPhone (Safari não tem botão de instalar automático)
    (function iosHint() {
      try {
        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
        const standalone = window.navigator.standalone === true ||
          window.matchMedia("(display-mode: standalone)").matches;
        let dismissed = false;
        try { dismissed = localStorage.getItem("rl_ioshint") === "1"; } catch (e) {}
        if (isIOS && !standalone && !dismissed) {
          $("iosHint").hidden = false;
          $("iosHintClose").addEventListener("click", () => {
            $("iosHint").hidden = true;
            try { localStorage.setItem("rl_ioshint", "1"); } catch (e) {}
          });
        }
      } catch (e) {}
    })();

    // Reforça a tela ligada: ao voltar pro app durante a navegação, repede o wake lock
    document.addEventListener("visibilitychange", async () => {
      if (document.visibilityState === "visible" &&
          document.body.classList.contains("navigating") && "wakeLock" in navigator) {
        try { wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
      }
    });

    // Quando o token do Mapbox chega (do servidor), troca o seletor simulado pelo
    // selo de trânsito real e ajusta os créditos.
    function applyMapboxUI() {
      const tf = document.getElementById("trafficField");
      if (tf) tf.innerHTML = '<label>Trânsito</label>' +
        '<div class="realtraffic">🚦 Trânsito real (ao vivo) via Mapbox — já considerado no cálculo</div>';
      const cr = document.getElementById("credits");
      if (cr) cr.textContent = "Dados: mapa OpenStreetMap · rotas e trânsito © Mapbox · altitude Open-Meteo.";
    }
    // Busca o token do Mapbox no servidor (só devolve para aparelhos ativados).
    async function loadMapboxToken() {
      if (!LICENSE.enabled || !LICENSE.endpoint) return;
      try {
        const r = await jsonp({ action: "mapbox", device: deviceId(), token: lockGet("rl_token") || "" });
        if (r && r.ok && r.mb) { MAPBOX.token = r.mb; applyMapboxUI(); }
      } catch (e) { /* sem token: segue com o trânsito simulado */ }
    }

    // ---- PWA: instalação e service worker ----
    let deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      $("install").hidden = false;
    });
    $("install").addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      $("install").hidden = true;
    });
    window.addEventListener("appinstalled", () => { $("install").hidden = true; });

    if ("serviceWorker" in navigator) {
      // recarrega automaticamente quando uma versão nova do app assume o controle
      let atualizando = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (atualizando) return;
        atualizando = true;
        location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
          .then((reg) => { try { reg.update(); } catch (e) {} })
          .catch((err) => console.warn("Falha ao registrar o service worker:", err));
      });
    }

    // ---- Trava de acesso (licença por servidor) ----
    // enabled:false = trava DESLIGADA (app funciona normalmente). Depois de publicar
    // o servidor, trocamos para true e colamos a URL do servidor em endpoint.
    const LICENSE = { enabled: true, endpoint: "https://script.google.com/macros/s/AKfycby12aEa66lpcmZiTGp35--8qqr_M680ts7Ku1wIp7Df9FOwXksTr7dfilueLMEXj9gT/exec" };

    function deviceId() {
      let id = null;
      try { id = localStorage.getItem("rl_device"); } catch (e) {}
      if (!id) {
        id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : "d-" + Date.now() + "-" + Math.random().toString(36).slice(2);
        try { localStorage.setItem("rl_device", id); } catch (e) {}
      }
      return id;
    }
    function lockStore(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
    function lockGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

    // chamada ao servidor via JSONP (evita problemas de CORS)
    function jsonp(params) {
      return new Promise((resolve, reject) => {
        const cb = "rlcb_" + Math.random().toString(36).slice(2);
        const s = document.createElement("script");
        const q = Object.keys(params).map(k => encodeURIComponent(k) + "=" + encodeURIComponent(params[k])).join("&");
        let done = false;
        const cleanup = () => { try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.remove(); };
        window[cb] = (data) => { done = true; cleanup(); resolve(data); };
        s.onerror = () => { if (!done) { cleanup(); reject(new Error("rede")); } };
        s.src = LICENSE.endpoint + (LICENSE.endpoint.indexOf("?") >= 0 ? "&" : "?") + q + "&callback=" + cb;
        document.body.appendChild(s);
        setTimeout(() => { if (!done) { cleanup(); reject(new Error("timeout")); } }, 20000);
      });
    }
    async function licenseActivate(key) {
      return jsonp({ action: "activate", key: key, device: deviceId(), ua: (navigator.userAgent || "").slice(0, 120) });
    }
    async function licenseCheck(token) {
      return jsonp({ action: "check", device: deviceId(), token: token || "" });
    }

    function showLock(msg, isErr) {
      $("lock").hidden = false;
      if (msg) { const st = $("lockStatus"); st.textContent = msg; st.className = "lock-status" + (isErr ? " err" : ""); }
    }
    function hideLock() { $("lock").hidden = true; }

    async function licenseGate() {
      if (!LICENSE.enabled || !LICENSE.endpoint) return true; // trava desligada
      const token = lockGet("rl_token");
      if (token) {
        try {
          const r = await licenseCheck(token);
          if (r && r.ok) { lockStore("rl_lastok", String(Date.now())); return true; }
          if (r && r.blocked) { lockStore("rl_token", null); }
        } catch (e) {
          // sem internet: tolera até 7 dias desde a última verificação bem-sucedida
          const last = Number(lockGet("rl_lastok") || 0);
          if (Date.now() - last < 7 * 24 * 3600 * 1000) return true;
        }
      }
      showLock();
      return false;
    }

    if ($("lockBtn")) {
      $("lockBtn").addEventListener("click", async () => {
        // normaliza: sem espaços e em MAIÚSCULAS (igual ao que aparece na tela)
        const key = ($("lockKey").value || "").trim().toUpperCase();
        if (!key) { showLock("Digite a chave.", true); return; }
        $("lockBtn").disabled = true;
        const st = $("lockStatus"); st.textContent = "Ativando…"; st.className = "lock-status";
        try {
          const r = await licenseActivate(key);
          if (r && r.ok) {
            lockStore("rl_token", r.token || "1");
            lockStore("rl_lastok", String(Date.now()));
            st.textContent = "✅ Ativado!"; st.className = "lock-status ok";
            setTimeout(hideLock, 600);
            loadMapboxToken();
          } else {
            st.textContent = "⚠️ " + ((r && r.reason) || "chave inválida"); st.className = "lock-status err";
          }
        } catch (e) {
          st.textContent = "⚠️ Sem conexão com o servidor."; st.className = "lock-status err";
        } finally {
          $("lockBtn").disabled = false;
        }
      });
      $("lockKey").addEventListener("keydown", (e) => { if (e.key === "Enter") $("lockBtn").click(); });
    }

    licenseGate().then((ok) => { if (ok) loadMapboxToken(); });
  })();
  </script>
</body>
</html>
